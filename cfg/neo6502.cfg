# neo6502.cfg — carte memoire cc65 pour le Neo6502 (NeoTel)
#
# RAM libre : $0800-$FBFF (le noyau 6502 occupe $FC00-$FFFF, le bloc de
# controle de l'API $FF00-$FF0F). Le programme est charge a $0800 (a la place
# de NeoBASIC) et demarre par l'adresse d'execution de l'en-tete .neo.
# Pile C cc65 : 64 octets sous $FC00 ($FBC0-$FBFF ; usage mesure 33 o). Les locales sont
# statiques (--static-locals) : la pile ne porte que les parametres ; usage
# mesure sur les dumps RAM des tests = 34 octets (tests/run.sh le verifie).
FEATURES {
    STARTADDRESS: default = $0800;
}

MEMORY {
    ZP:        start = $0000, size = $00FF, type = rw, define = yes;
    RAM:       start = $0800, size = $F3C0, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    EXTZP:    load = ZP,   type = zp,  define = yes, optional = yes;
    STARTUP:  load = RAM,  type = rw;
    LOWCODE:  load = RAM,  type = rw,  optional = yes;
    ONCE:     load = RAM,  type = rw,  optional = yes;
    CODE:     load = RAM,  type = rw;
    RODATA:   load = RAM,  type = ro;
    DATA:     load = RAM,  type = rw,  define = yes;
    BSS:      load = RAM,  type = bss, define = yes;
}

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0040;   # pile C : $FBC0-$FBFF
}
